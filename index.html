<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>车账本</title>
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="车账本">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar"><h1 id="title">记一笔</h1></header>

  <main>
    <!-- 记账 -->
    <section id="view-add" class="view active">
      <form id="form" autocomplete="off" novalidate>
        <div class="type-grid" id="typeGrid"></div>

        <div class="card">
          <label class="field"><span>日期</span><input type="date" name="date" required></label>
          <div id="fuelFields">
            <label class="field"><span>单价 (元/升)</span><input type="text" inputmode="decimal" name="price" placeholder="0.00"></label>
            <label class="field"><span>加油量 (升)</span><input type="text" inputmode="decimal" name="liters" placeholder="0.00"></label>
          </div>
          <label class="field"><span id="amountLabel">金额 (元)</span><input type="text" inputmode="decimal" name="amount" placeholder="0.00"></label>
          <label class="field"><span>里程表 (km)</span><input type="text" inputmode="numeric" name="odometer" placeholder="选填"></label>
          <p class="hint" id="odoHint"></p>
          <label class="field switch" id="fullRow"><span>本次加满</span><input type="checkbox" name="full" checked></label>
          <label class="field"><span>备注</span><input type="text" name="note" placeholder="选填"></label>
        </div>
        <p class="hint" id="fuelTip">油耗按“加满法”计算：两次加满之间的加油量 ÷ 行驶里程。</p>

        <button type="submit" class="btn primary" id="saveBtn">保存</button>
        <div class="row-btns" id="editBtns" hidden>
          <button type="button" class="btn" id="cancelEdit">取消编辑</button>
          <button type="button" class="btn danger" id="deleteBtn">删除</button>
        </div>
      </form>
    </section>

    <!-- 明细 -->
    <section id="view-list" class="view">
      <div class="toolbar">
        <select id="filter" aria-label="按类型筛选"></select>
      </div>
      <div id="list"></div>
    </section>

    <!-- 统计 -->
    <section id="view-stats" class="view">
      <div class="toolbar"><select id="yearSel" aria-label="选择年份"></select></div>
      <div class="kpis" id="kpis"></div>
      <div class="card"><h2>每月支出</h2><div id="monthChart"></div></div>
      <div class="card"><h2>分类支出</h2><div id="catList"></div></div>
      <div class="card"><h2>油耗记录</h2><div id="fuelList"></div></div>
    </section>

    <!-- 设置 -->
    <section id="view-settings" class="view">
      <div class="card">
        <label class="field"><span>车辆名称</span><input type="text" id="carName" placeholder="例如：我的车"></label>
      </div>
      <div class="card">
        <h2>数据备份</h2>
        <p class="hint" id="backupInfo"></p>
        <button class="btn" id="exportJson">导出备份 (JSON)</button>
        <button class="btn" id="importJson">从备份恢复</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <button class="btn" id="exportCsv">导出表格 (CSV，可用 Excel 打开)</button>
      </div>
      <div class="card">
        <h2>危险操作</h2>
        <button class="btn danger" id="clearAll">清空全部数据</button>
      </div>
      <p class="hint center">数据只保存在本机浏览器中，请定期导出备份。<br>v1.0</p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="add" class="active"><span>✏️</span>记一笔</button>
    <button data-view="list"><span>📋</span>明细</button>
    <button data-view="stats"><span>📊</span>统计</button>
    <button data-view="settings"><span>⚙️</span>设置</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
